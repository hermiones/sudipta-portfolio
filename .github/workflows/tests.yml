name: Portfolio tests
on:
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: '30 3 * * *'   # daily
  workflow_dispatch:
jobs:
  e2e:
    # on Vercel deploys, only run once production is live
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    env:
      CI: true
      SITE_URL: https://sudipta.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 14
